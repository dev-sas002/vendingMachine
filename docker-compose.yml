# One command, no manual steps:
#
#   docker compose up --build
#
# The web container waits for Postgres, creates and migrates the database,
# loads the demo seeds and then serves the API on http://localhost:8400.
#
#   Swagger UI   http://localhost:8400/api-docs
#   Health       http://localhost:8400/health
#   Sidekiq UI   http://localhost:8400/jobmonitor
#   Products     http://localhost:8400/products
#
# Demo accounts (created by db/seeds.rb): seller@example.com and
# buyer@example.com, both with the password `password123`.

x-app: &app
  build:
    context: .
    args:
      # Empty means "install every gem group", which is what the development
      # demo stack needs. A production build passes development:test here.
      BUNDLE_WITHOUT: ""
  environment: &app_env
    RAILS_ENV: development
    RAILS_LOG_TO_STDOUT: "true"
    RAILS_MAX_THREADS: "5"
    DB_HOST: db
    DB_USERNAME: postgres
    DB_PASSWORD: postgres
    DB_NAME: vending_machine
    REDIS_URL: redis://redis:6379/0
    SEED_PASSWORD: password123
    SERVER_URL: localhost:8400
    DEFAULT_FROM_EMAIL_ADDRESS: no-reply@vending.local
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:13-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vending_machine
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host ports for this project are 8400-8409.
      - "8401:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vending_machine"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:6-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "8402:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    <<: *app
    command: ["web"]
    ports:
      - "8400:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  worker:
    <<: *app
    command: ["worker"]
    environment:
      <<: *app_env
      # Sidekiq runs 15 threads (config/sidekiq.yml); give each one a
      # connection of its own.
      DB_POOL: "16"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f sidekiq > /dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      start_period: 45s
      retries: 5

volumes:
  pgdata:
