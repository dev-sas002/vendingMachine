default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch('DB_HOST', 'localhost') %>
  # Sized to the web server's thread pool so a Puma thread never waits on a
  # connection checkout; Sidekiq sets DB_POOL to its own concurrency.
  pool: <%= ENV.fetch('DB_POOL') { ENV.fetch('RAILS_MAX_THREADS', 5) } %>
  timeout: 5000
  username: <%= ENV.fetch('DB_USERNAME', 'postgres') %>
  password: <%= ENV.fetch('DB_PASSWORD', 'postgres') %>
  database: <%= ENV.fetch('DB_NAME', 'vending_machine') %>

development:
  <<: *default

test:
  <<: *default
  database: <%= "#{ENV.fetch('DB_NAME', 'vending_machine')}-test" %>
