---
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/api/v1/products":
    parameters:
    - name: access-token
      in: header
      required: true
      schema:
        type: string
    - name: client
      in: header
      required: true
      schema:
        type: string
    - name: uid
      in: header
      required: true
      schema:
        type: string
    get:
      summary: list products
      parameters:
      - name: page
        in: query
        required: false
        description: Page number (default 1)
        schema:
          type: integer
      - name: items
        in: query
        required: false
        description: Page size (default 25, maximum 100)
        schema:
          type: integer
      responses:
        '200':
          description: successful
          content:
            application/json:
              example:
              - id: 400
                name: MyProduct
                price: 100
                available_count: 10
                available_amount: 10
                seller_id: 74
                seller:
                  id: 74
                  email: giuseppe@corwin-boehm.test
                created_at: '2026-11-08T13:00:33.451-05:00'
                updated_at: '2026-11-08T13:00:33.451-05:00'
              - id: 401
                name: MyProduct
                price: 100
                available_count: 10
                available_amount: 10
                seller_id: 74
                seller:
                  id: 74
                  email: giuseppe@corwin-boehm.test
                created_at: '2026-11-08T13:00:33.452-05:00'
                updated_at: '2026-11-08T13:00:33.452-05:00'
              - id: 402
                name: MyProduct
                price: 100
                available_count: 10
                available_amount: 10
                seller_id: 74
                seller:
                  id: 74
                  email: giuseppe@corwin-boehm.test
                created_at: '2026-11-08T13:00:33.453-05:00'
                updated_at: '2026-11-08T13:00:33.453-05:00'
              - id: 403
                name: MyProduct
                price: 100
                available_count: 10
                available_amount: 10
                seller_id: 74
                seller:
                  id: 74
                  email: giuseppe@corwin-boehm.test
                created_at: '2026-11-08T13:00:33.453-05:00'
                updated_at: '2026-11-08T13:00:33.453-05:00'
              - id: 404
                name: MyProduct
                price: 100
                available_count: 10
                available_amount: 10
                seller_id: 74
                seller:
                  id: 74
                  email: giuseppe@corwin-boehm.test
                created_at: '2026-11-08T13:00:33.454-05:00'
                updated_at: '2026-11-08T13:00:33.454-05:00'
    post:
      summary: create product
      parameters:
      - name: name
        in: query
        required: true
        description: Name of the Product
        schema:
          type: string
      - name: available_count
        in: query
        required: true
        description: Number of quantities
        schema:
          type: integer
      - name: price
        in: query
        required: true
        description: Price of the product
        schema:
          type: integer
      responses:
        '201':
          description: created
          content:
            application/json:
              example:
                id: 410
                name: CreatedProduct
                price: 99
                available_count: 10
                available_amount: 10
                seller_id: 75
                seller:
                  id: 75
                  email: harrison@pfeffer.test
                created_at: '2026-11-08T13:00:33.490-05:00'
                updated_at: '2026-11-08T13:00:33.490-05:00'
  "/api/v1/products/{id}":
    parameters:
    - name: id
      in: path
      description: id
      required: true
      schema:
        type: string
    - name: access-token
      in: header
      required: true
      schema:
        type: string
    - name: client
      in: header
      required: true
      schema:
        type: string
    - name: uid
      in: header
      required: true
      schema:
        type: string
    get:
      summary: show product
      responses:
        '200':
          description: successful
          content:
            application/json:
              example:
                id: 411
                name: MyProduct
                price: 100
                available_count: 10
                available_amount: 10
                seller_id: 76
                seller:
                  id: 76
                  email: elicia@stehr.test
                created_at: '2026-11-08T13:00:33.499-05:00'
                updated_at: '2026-11-08T13:00:33.499-05:00'
    patch:
      summary: update product
      parameters:
      - name: amount
        in: query
        description: Product Price
        schema:
          type: integer
      responses:
        '200':
          description: successful
          content:
            application/json:
              example:
                id: 416
                name: MyProduct
                price: 150
                available_count: 10
                available_amount: 10
                seller_id: 77
                seller:
                  id: 77
                  email: desmond@kilback-ziemann.test
                created_at: '2026-11-08T13:00:33.518-05:00'
                updated_at: '2026-11-08T13:00:33.532-05:00'
    delete:
      summary: delete product
      responses:
        '200':
          description: successful
          content:
            application/json:
              example:
                id: 421
                name: MyProduct
                price: 100
                available_count: 10
                available_amount: 10
                seller_id: 78
                seller:
                  id: 78
                  email: mitchell.schimmel@west.example
                created_at: '2026-11-08T13:00:33.541-05:00'
                updated_at: '2026-11-08T13:00:33.541-05:00'
  "/api/v1/buy":
    parameters:
    - name: product_id
      in: query
      description: Product Id
      schema:
        type: integer
    - name: quantity
      in: query
      description: Quantity
      schema:
        type: integer
    - name: access-token
      in: header
      required: true
      schema:
        type: string
    - name: client
      in: header
      required: true
      schema:
        type: string
    - name: uid
      in: header
      required: true
      schema:
        type: string
    post:
      summary: buy vending_machine
      responses:
        '200':
          description: successful
          content:
            application/json:
              example:
                total_bill: 100
                product:
                  id: 458
                  name: MyProduct
                  price: 100
                  available_count: 9
                  available_amount: 9
                  seller_id: 221
                  seller:
                    id: 221
                    email: brandi@gutmann.example
                  created_at: '2026-11-08T13:00:35.401-05:00'
                  updated_at: '2026-11-08T13:00:35.415-05:00'
                remaining_amount: 400
                change:
                  coins:
                    '100': 4
                  remainder: 0
        '422':
          description: the buyer cannot afford the order
          content:
            application/json:
              example:
                error: Order Amount exceeded your current Amount
  "/api/v1/deposit":
    parameters:
    - name: deposit_amount
      in: query
      description: Deposit Amount
      schema:
        type: integer
    - name: access-token
      in: header
      required: true
      schema:
        type: string
    - name: client
      in: header
      required: true
      schema:
        type: string
    - name: uid
      in: header
      required: true
      schema:
        type: string
    post:
      summary: deposit vending_machine
      responses:
        '200':
          description: successful
          content:
            application/json:
              example:
                message: Amount Deposited Successfully
                deposit_amount: 505
        '422':
          description: the machine does not take that coin
          content:
            application/json:
              example:
                error: Invalid Amount
  "/api/v1/reset":
    parameters:
    - name: access-token
      in: header
      required: true
      schema:
        type: string
    - name: client
      in: header
      required: true
      schema:
        type: string
    - name: uid
      in: header
      required: true
      schema:
        type: string
    post:
      summary: reset vending_machine
      responses:
        '200':
          description: successful
          content:
            application/json:
              example:
                message: Deposit Amount Reset Successfully
                returned_amount: 500
                change:
                  coins:
                    '100': 5
                  remainder: 0
servers:
- url: http://{defaultHost}
  variables:
    defaultHost:
      default: www.example.com
